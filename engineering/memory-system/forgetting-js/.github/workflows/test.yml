name: test

on:
  push:
    paths:
      - 'engineering/memory-system/forgetting-js/**'
  pull_request:
    paths:
      - 'engineering/memory-system/forgetting-js/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engineering/memory-system/forgetting-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
