# Live counts, re-checked by scripts/check_claim_drift.py:
# pytest passed: 112
# forgetting-js assertions: 103
# Only this file is a GitHub Actions workflow. Paths under a nested
# .github/ directory are not loaded.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  memory-system-tests:
    name: memory-system tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: engineering/memory-system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engineering/memory-system/requirements.txt

      - name: Install pinned deps
        run: python -m pip install -r requirements.txt

      - name: Run memory-system tests
        run: python -m pytest tests/ -q

      - name: Smoke-run the API app (import only; no external calls)
        run: python -c "import app.main; print('app.main imports cleanly')"
        env:
          CONSOLIDATOR_PROVIDER: keyword
          MEMORY_CORS_ORIGINS: ""

  forgetting-js:
    name: forgetting-js assertions (node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engineering/memory-system/forgetting-js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No npm dependencies. npm install is intentionally not required.
      - name: Run forgetting-js assertions
        run: node test/forgetting.test.mjs

  claim-drift:
    name: offline claim drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engineering/memory-system/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned deps
        run: python -m pip install -r engineering/memory-system/requirements.txt

      - name: Re-run suites and compare documented counts
        run: python scripts/check_claim_drift.py
